name: verify

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Benchmark
        run: npm run bench -- --output benchmark.json

      - name: Audit
        run: npm audit --omit=dev

      - name: Pack dry run
        run: npm pack --dry-run --json --ignore-scripts
