name: verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Verify
        run: npm run verify

      - name: Production audit
        run: npm audit --omit=dev

      - name: Pack dry run
        run: npm pack --dry-run --json --ignore-scripts
