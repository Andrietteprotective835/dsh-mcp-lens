name: Search miss
description: Add a sanitized retrieval failure to the regression corpus
title: "[search-miss] "
labels: [search-quality]
body:
  - type: input
    id: query
    attributes:
      label: Query
      description: The smallest query that fails to rank the expected tool.
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected server/tool
      placeholder: server/tool_name
    validations:
      required: true
  - type: textarea
    id: metadata
    attributes:
      label: Sanitized tool metadata
      description: Include name, description and inputSchema only. Replace private names and values.
      render: json
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual ranked result
    validations:
      required: true
  - type: checkboxes
    id: license
    attributes:
      label: Fixture consent
      options:
        - label: This fixture is sanitized and may be committed under the MIT License.
          required: true
